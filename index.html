<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TGG Estimates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-default:#ffffff; --bg-secondary:#f5f5f5; --bg-tertiary:#e3e3e3; --bg-disabled:#d9d9d9;
    --bg-brand:#2c2c2c; --bg-brand-hover:#1e1e1e; --text-on-brand:#f5f5f5;
    --border-default:#d9d9d9; --border-strong:#767676; --border-brand:#2c2c2c;
    --text-default:#1e1e1e; --text-secondary:#303030; --text-tertiary:#757575; --text-disabled:#b3b3b3;
    --text-danger:#900b09; --bg-danger:#fdd3d0;
    --accent:#3FA9F5; --accent-ink:#0d6cab; --accent-wash:#eaf5fe;
    --radius:8px; --radius-pill:999px;
    --sp-100:4px; --sp-200:8px; --sp-300:12px; --sp-400:16px; --sp-600:24px;
    --size-control:40px; --size-icon-btn:44px;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; background:var(--bg-secondary); color:var(--text-default);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.4; -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:760px;margin:0 auto;padding-bottom:104px;}
  svg{display:block;flex-shrink:0;}

  /* header */
  header{
    background:var(--bg-default); border-bottom:1px solid var(--border-default);
    padding:var(--sp-400); display:flex; align-items:center; justify-content:space-between; gap:var(--sp-400);
    position:sticky; top:0; z-index:20;
  }
  .brand{display:flex;align-items:center;gap:var(--sp-300);min-width:0;}
  .brand .logo{width:52px;color:var(--text-default);}
  .brand .logo svg{width:100%;height:auto;}
  .brand .divider{width:1px;height:28px;background:var(--border-default);}
  .brand .word{font-size:19px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;}

  /* buttons */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-200);
    min-height:var(--size-control);padding:var(--sp-200) var(--sp-300);border-radius:var(--radius);
    border:1px solid transparent;font-family:inherit;font-size:16px;font-weight:500;line-height:1.2;
    cursor:pointer;white-space:nowrap;text-align:center;}
  .btn-primary{background:var(--bg-brand);border-color:var(--border-brand);color:var(--text-on-brand);}
  .btn-primary:active{background:var(--bg-brand-hover);}
  .btn-neutral{background:var(--bg-tertiary);border-color:var(--border-strong);color:var(--text-default);}
  .btn-neutral:active{background:var(--bg-disabled);}
  .btn-subtle{background:transparent;color:var(--text-secondary);}
  .btn-subtle:active{background:var(--bg-secondary);}
  .btn-danger{background:transparent;color:var(--text-danger);}
  .btn-danger:active{background:var(--bg-danger);}
  .btn-full{width:100%;}
  .btn-sm{height:32px;font-size:14px;padding:0 10px;}
  .icon-btn{
    width:var(--size-icon-btn);height:var(--size-icon-btn);border-radius:var(--radius-pill);
    border:1px solid transparent;display:flex;align-items:center;justify-content:center;
    cursor:pointer;background:transparent;color:var(--text-default);
  }
  .icon-btn-primary{background:var(--bg-brand);border-color:var(--border-brand);color:var(--text-on-brand);}
  .icon-btn-primary:active{background:var(--bg-brand-hover);}
  @media(max-width:420px){ .btn .btn-label{display:none;} .btn{padding:0 var(--sp-300);} }

  /* cards */
  .card{
    background:var(--bg-default);border:1px solid var(--border-default);border-radius:var(--radius);
    margin:var(--sp-400) var(--sp-400) 0;padding:var(--sp-400);
  }
  .card-title{
    display:flex;align-items:center;gap:var(--sp-200);margin-bottom:var(--sp-400);
    font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-tertiary);
  }
  .card-title svg{color:var(--text-tertiary);}

  /* fields */
  .field{margin-bottom:var(--sp-400);}
  .field:last-child{margin-bottom:0;}
  .field > label{display:block;font-size:14px;font-weight:500;margin-bottom:6px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-300);}
  @media(max-width:480px){ .grid2{grid-template-columns:1fr;} }
  input[type=text],input[type=number],input[type=date],textarea,select{
    width:100%;font-family:inherit;font-size:16px;color:var(--text-default);background:var(--bg-default);
    border:1px solid var(--border-default);border-radius:var(--radius);padding:var(--sp-300) var(--sp-400);
  }
  input[type=text],input[type=number],input[type=date],select{height:var(--size-control);padding-top:0;padding-bottom:0;}
  input[type=date]{-webkit-appearance:none;appearance:none;}
  input[type=date]::-webkit-date-and-time-value{text-align:left;}
  input[type=date]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.55;}
  select{padding-right:34px;appearance:none;-webkit-appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--text-tertiary) 50%),linear-gradient(135deg,var(--text-tertiary) 50%,transparent 50%);
    background-position:calc(100% - 19px) center,calc(100% - 14px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
  textarea{min-height:76px;resize:vertical;}
  input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .unit-wrap{position:relative;}
  .unit-wrap .adorn{position:absolute;top:50%;transform:translateY(-50%);color:var(--text-tertiary);font-size:15px;pointer-events:none;}
  .unit-wrap.pre .adorn{left:12px;}
  .unit-wrap.pre input{padding-left:26px;}
  .unit-wrap.post .adorn{right:12px;}
  .unit-wrap.post input{padding-right:44px;}

  /* segmented + chips */
  .seg{display:flex;border:1px solid var(--border-default);border-radius:var(--radius);overflow:hidden;}
  .seg button{flex:1;min-height:var(--size-control);border:none;border-right:1px solid var(--border-default);
    background:var(--bg-default);color:var(--text-default);font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;padding:var(--sp-200) 6px;line-height:1.2;white-space:nowrap;}
  .seg button:last-child{border-right:none;}
  .seg button[aria-pressed="true"]{background:var(--bg-brand);color:var(--text-on-brand);}
  .chips{display:flex;flex-wrap:wrap;gap:var(--sp-200);}
  .chips button{display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border-radius:var(--radius-pill);
    border:1px solid var(--border-default);background:var(--bg-default);color:var(--text-secondary);
    font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;}
  .chips button[aria-pressed="true"]{background:var(--bg-brand);border-color:var(--border-brand);color:var(--text-on-brand);}
  .chips button .check{display:none;}
  .chips button[aria-pressed="true"] .check{display:block;}

  /* service accordion */
  .svc{background:var(--bg-default);border:1px solid var(--border-default);border-radius:var(--radius);
    margin:var(--sp-300) var(--sp-400) 0;overflow:hidden;}
  .svc-head{display:flex;align-items:center;gap:var(--sp-300);padding:var(--sp-300) var(--sp-400);cursor:pointer;
    background:none;border:none;width:100%;font-family:inherit;text-align:left;}
  .svc-head .ico{width:36px;height:36px;border-radius:var(--radius);background:var(--bg-secondary);
    display:flex;align-items:center;justify-content:center;color:var(--text-secondary);}
  .svc-head .name{flex:1;min-width:0;font-size:16px;font-weight:600;}
  .svc-head .sum{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .svc-head .chev{color:var(--text-tertiary);transition:transform .15s ease;}
  .svc-head[aria-expanded="true"] .chev{transform:rotate(180deg);}
  .svc-body{display:none;padding:0 var(--sp-400) var(--sp-400);border-top:1px solid var(--border-default);}
  .svc-body.open{display:block;}
  .svc-section{padding-top:var(--sp-400);}
  .svc-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
    color:var(--text-tertiary);margin-bottom:var(--sp-300);}

  /* counters */
  .counters{display:flex;flex-wrap:wrap;gap:var(--sp-200);}
  .counter{flex:1 1 0;min-width:92px;border:1px solid var(--border-default);border-radius:var(--radius);
    padding:var(--sp-200) 6px;text-align:center;}
  /* on phones each count gets its own full-width row: label left, controls right */
  @media(max-width:600px){
    .counters{flex-direction:column;flex-wrap:nowrap;gap:6px;}
    .counter{flex:none;width:100%;display:flex;align-items:center;justify-content:space-between;
      gap:var(--sp-300);padding:5px 6px 5px var(--sp-300);text-align:left;}
    .counter .lbl{margin-bottom:0;font-size:12px;}
    .counter .ctrl{gap:var(--sp-300);}
    .counter input.num{max-width:56px;}
  }
  .counter .lbl{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    color:var(--text-tertiary);margin-bottom:6px;}
  .counter .ctrl{display:flex;align-items:center;justify-content:center;gap:var(--sp-200);}
  .counter button{width:38px;height:38px;flex-shrink:0;border-radius:var(--radius);border:none;background:var(--bg-secondary);
    color:var(--text-default);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .counter button:active{background:var(--bg-tertiary);}
  .counter input.num{width:100%;min-width:0;max-width:60px;height:38px;border:1px solid transparent;
    background:transparent;text-align:center;font-family:inherit;font-size:18px;font-weight:600;
    font-variant-numeric:tabular-nums;color:inherit;padding:0;border-radius:var(--radius);}
  .counter input.num:hover{border-color:var(--border-default);}
  .counter input.num:focus{border-color:var(--accent);background:var(--bg-default);outline:none;}
  .counter.has-count{border-color:var(--accent);background:var(--accent-wash);}
  .counter.has-count input.num{color:var(--accent-ink);}
  .counter.has-count .lbl{color:var(--accent-ink);}

  /* window type rows */
  .wt{border:1px solid var(--border-default);border-radius:var(--radius);padding:var(--sp-300);margin-bottom:var(--sp-300);}
  .wt-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-200);margin-bottom:var(--sp-300);}
  .wt-name{display:flex;align-items:center;gap:var(--sp-200);font-size:15px;font-weight:600;}
  .wt-name svg{color:var(--text-tertiary);}
  .wt-tags{display:flex;flex-wrap:wrap;gap:var(--sp-100);margin-top:6px;}
  .tag{font-size:12px;font-weight:500;line-height:1;padding:5px 8px;border-radius:var(--radius-pill);
    background:var(--bg-secondary);border:1px solid var(--border-default);color:var(--text-secondary);}
  .mini-remove{background:none;border:none;padding:6px;border-radius:var(--radius);color:var(--text-tertiary);cursor:pointer;display:flex;}
  .mini-remove:active{background:var(--bg-danger);color:var(--text-danger);}
  .wt-foot{display:flex;justify-content:flex-end;align-items:baseline;gap:var(--sp-200);
    margin-top:var(--sp-300);padding-top:var(--sp-200);border-top:1px solid var(--border-default);}
  .wt-foot .k{font-size:12px;color:var(--text-tertiary);}
  .wt-foot .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;}

  /* simple rows */
  .row{display:flex;align-items:center;gap:var(--sp-300);padding:var(--sp-300) 0;border-bottom:1px solid var(--border-default);}
  .row:last-child{border-bottom:none;padding-bottom:0;}
  .row .label{flex:1;display:flex;align-items:center;gap:var(--sp-200);font-size:15px;font-weight:500;}
  .row .label svg{color:var(--text-tertiary);}
  .row .ctrl{display:flex;align-items:center;gap:var(--sp-200);}
  .row .ctrl button{width:36px;height:36px;border-radius:var(--radius);border:1px solid var(--border-default);
    background:var(--bg-default);color:var(--text-default);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .row .ctrl button:active{background:var(--bg-secondary);}
  .row input.num{width:48px;height:36px;border:1px solid transparent;background:transparent;text-align:center;
    font-family:inherit;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;color:inherit;
    padding:0;border-radius:var(--radius);}
  .row input.num:hover{border-color:var(--border-default);}
  .row input.num:focus{border-color:var(--accent);background:var(--bg-default);outline:none;}
  .row .amt{width:76px;text-align:right;font-size:14px;color:var(--text-tertiary);font-variant-numeric:tabular-nums;}

  /* surface line rows (power washing) */
  .line{display:flex;gap:var(--sp-200);align-items:center;margin-bottom:var(--sp-200);}
  .line select{flex:1.3;min-width:0;}
  .line .unit-wrap{flex:1;min-width:0;}

  /* breakdown */
  .bd-row{display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp-300);
    padding:10px 0;border-bottom:1px solid var(--border-default);font-size:15px;}
  .bd-row:last-of-type{border-bottom:none;}
  .bd-row .k{color:var(--text-secondary);}
  .bd-row .k small{display:block;font-size:12px;color:var(--text-tertiary);}
  .bd-row .v{font-weight:500;font-variant-numeric:tabular-nums;}
  .svc-sub{display:flex;justify-content:space-between;align-items:baseline;margin-top:var(--sp-300);
    padding-top:var(--sp-300);border-top:2px solid var(--text-default);}
  .svc-sub .k{font-size:13px;font-weight:600;color:var(--text-secondary);}
  .svc-sub .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;}

  /* disclosure */
  .disclosure{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;
    border:none;padding:var(--sp-300) 0 0;cursor:pointer;font-family:inherit;border-top:1px solid var(--border-default);margin-top:var(--sp-400);}
  .disclosure .dl{display:flex;align-items:center;gap:var(--sp-200);font-size:12px;font-weight:600;
    text-transform:uppercase;letter-spacing:.06em;color:var(--text-tertiary);}
  .disclosure .chev{color:var(--text-tertiary);transition:transform .15s ease;}
  .disclosure[aria-expanded="true"] .chev{transform:rotate(180deg);}
  .rates{display:none;padding-top:var(--sp-300);}
  .rates.open{display:block;}
  .rate{display:flex;align-items:center;gap:var(--sp-300);margin-bottom:var(--sp-200);}
  .rate label{flex:1;font-size:14px;}
  .rate .unit-wrap{width:110px;flex-shrink:0;}
  .hint{font-size:13px;color:var(--text-tertiary);margin:0 0 var(--sp-300);}

  /* empty */
  .empty{border:1px dashed var(--border-default);border-radius:var(--radius);padding:var(--sp-600) var(--sp-400);
    text-align:center;color:var(--text-tertiary);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:var(--sp-200);
    margin:var(--sp-300) var(--sp-400) 0;background:var(--bg-default);}

  /* grand total bar */
  .totalbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg-brand);color:var(--text-on-brand);z-index:30;
    padding-bottom:env(safe-area-inset-bottom);}
  .totalbar-inner{max-width:760px;margin:0 auto;padding:var(--sp-300) var(--sp-400);
    display:flex;align-items:center;justify-content:space-between;gap:var(--sp-300);}
  .totalbar .k{font-size:13px;font-weight:500;color:#b3b3b3;}
  .totalbar .k small{display:block;font-size:11px;}
  .totalbar .v{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--accent);}

  /* dialog */
  .scrim{display:none;position:fixed;inset:0;background:rgba(30,30,30,.5);z-index:60;align-items:flex-end;justify-content:center;}
  .scrim.open{display:flex;}
  .dialog{background:var(--bg-default);width:100%;max-width:520px;border-radius:var(--radius) var(--radius) 0 0;max-height:90vh;overflow-y:auto;}
  @media(min-width:560px){ .scrim{align-items:center;} .dialog{border-radius:var(--radius);} }
  .dialog-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-300);
    padding:var(--sp-400);border-bottom:1px solid var(--border-default);position:sticky;top:0;background:var(--bg-default);}
  .dialog-head h3{margin:0;font-size:18px;font-weight:600;}
  .dialog-body{padding:var(--sp-400);}
  .dialog-foot{display:flex;gap:var(--sp-300);padding:var(--sp-400);border-top:1px solid var(--border-default);
    position:sticky;bottom:0;background:var(--bg-default);}
  .dialog-foot .btn{flex:1;}
  .menu-item{display:flex;align-items:center;gap:var(--sp-300);width:100%;padding:var(--sp-300);
    border:1px solid var(--border-default);border-radius:var(--radius);background:var(--bg-default);
    font-family:inherit;font-size:16px;font-weight:500;color:var(--text-default);cursor:pointer;
    margin-bottom:var(--sp-200);text-align:left;}
  .menu-item:active{background:var(--bg-secondary);}
  .menu-item .ico{width:36px;height:36px;border-radius:var(--radius);background:var(--bg-secondary);
    display:flex;align-items:center;justify-content:center;color:var(--text-secondary);flex-shrink:0;}
  .menu-item .mi-text{flex:1;min-width:0;}
  .menu-item .mi-text small{display:block;font-size:12px;font-weight:400;color:var(--text-tertiary);}
  .menu-item[disabled]{opacity:.45;cursor:default;}

  /* saved estimates */
  .status-line{display:flex;align-items:center;justify-content:center;gap:6px;
    margin:var(--sp-300) var(--sp-400) 0;font-size:12px;color:var(--text-tertiary);min-height:16px;}
  .status-line svg{color:var(--text-tertiary);}
  .status-line.warn{color:var(--text-danger);}
  .status-line.warn svg{color:var(--text-danger);}
  .saved-item{display:flex;align-items:center;gap:var(--sp-300);width:100%;padding:var(--sp-300);
    border:1px solid var(--border-default);border-radius:var(--radius);background:var(--bg-default);
    margin-bottom:var(--sp-200);}
  .saved-item.current{border-color:var(--accent);background:var(--accent-wash);}
  .saved-load{flex:1;min-width:0;background:none;border:none;padding:0;text-align:left;
    font-family:inherit;font-size:15px;font-weight:600;color:var(--text-default);cursor:pointer;}
  .saved-load small{display:block;font-size:12px;font-weight:400;color:var(--text-tertiary);margin-top:2px;}
  .saved-amt{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .saved-empty{text-align:center;color:var(--text-tertiary);font-size:14px;padding:var(--sp-600) 0;}

  /* footer actions */
  .footer-bar{display:flex;gap:var(--sp-300);margin:var(--sp-600) var(--sp-400) 0;}
  .footer-bar .btn{flex:1;}
  .btn-ghost{background:transparent;border-color:var(--border-default);color:var(--text-tertiary);font-size:14px;font-weight:500;}
  .btn-ghost:active{background:var(--bg-default);color:var(--text-default);}
  .btn-ghost svg{color:var(--text-tertiary);}
  .btn-accent{background:transparent;border-color:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:600;}
  .btn-accent:active{background:var(--accent-wash);}

  .master-note{display:flex;gap:var(--sp-200);align-items:flex-start;background:var(--accent-wash);
    border:1px solid var(--accent);border-radius:var(--radius);padding:var(--sp-300);
    font-size:13px;color:var(--accent-ink);margin-bottom:var(--sp-400);}
  .master-group{font-size:13px;font-weight:600;color:var(--text-default);
    padding:var(--sp-300) 0 var(--sp-200);margin-top:var(--sp-300);border-bottom:1px solid var(--border-default);
    display:flex;align-items:center;gap:var(--sp-200);}
  .master-group:first-of-type{margin-top:0;}
  .master-group svg{color:var(--text-tertiary);}
  .master-fields{padding-top:var(--sp-300);}

  /* ===== responsive ===== */
  /* tablet and up */
  @media(min-width:768px){
    .wrap{max-width:820px;}
    .totalbar-inner{max-width:820px;}
    header{padding:var(--sp-400) var(--sp-600);}
    .card,.svc,.empty{margin-left:var(--sp-600);margin-right:var(--sp-600);}
    .footer-bar{margin-left:var(--sp-600);margin-right:var(--sp-600);}
    .brand .word{font-size:21px;}
    .brand .logo{width:60px;}
    .gutter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-300);}
    .gutter-grid .field{margin-bottom:0;}
    .rate .unit-wrap{width:130px;}
  }
  /* large tablet / desktop */
  @media(min-width:1024px){
    .wrap{max-width:900px;}
    .totalbar-inner{max-width:900px;}
  }
  /* small phones */
  @media(max-width:560px){
    .line{flex-wrap:wrap;}
    .line select{flex:1 1 100%;}
    .line .unit-wrap{flex:1 1 auto;}
  }
  /* footer buttons need their own line well before 400px now that there are three */
  @media(max-width:640px){
    .footer-bar{flex-direction:column;}
  }
  @media(max-width:400px){

/* ============ helpers ============ */
function fmt(n){ return '$' + (n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function money(id,val,step){ return '<div class="unit-wrap pre"><span class="adorn">$</span><input type="number" inputmode="decimal" step="'+(step||0.5)+'" data-rate="'+id+'" value="'+val+'"></div>'; }
function pct(id,val){ return '<div class="unit-wrap post"><span class="adorn">%</span><input type="number" inputmode="decimal" step="1" data-rate="'+id+'" value="'+val+'"></div>'; }
function num(id,val,step){ return '<div class="unit-wrap"><input type="number" inputmode="decimal" step="'+(step||1)+'" data-rate="'+id+'" value="'+val+'"></div>'; }

    '<input type="number" inputmode="numeric" min="0" step="1" data-field="'+field+'" value="'+(val||'')+'" placeholder="'+(ph||'0')+'"></div>';
}
function counterHTML(field,label,val){
  return '<div class="counter'+(val>0?' has-count':'')+'"><span class="lbl">'+label+'</span><div class="ctrl">'+
    '<button data-count="'+field+'" data-dir="-1" aria-label="Decrease '+label+'">'+I.minus+'</button>'+
    '<input class="num" type="text" inputmode="numeric" autocomplete="off" data-numinput="'+field+'" '+
      'value="'+val+'" aria-label="'+label+' count">'+
    '<button data-count="'+field+'" data-dir="1" aria-label="Increase '+label+'">'+I.plus+'</button></div></div>';
}
function toggleHTML(field,label,on){

    '<button type="button" data-val="0" aria-pressed="'+(!on)+'">No</button>'+

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function n(v){ var x = parseFloat(v); return isNaN(x) ? 0 : x; }

/* ============ calculations ============ */
function winPanePrice(wt, floor, r){
  var add = wt.features.reduce(function(s,k){
    var f = WIN_FEATURES.find(function(x){return x.k===k;});
    return s + (f ? n(r[f.rate]) : 0);
  },0);
  if(wt.size === 'Grid'){
    var g = floor==='f1'? n(r.g1) : floor==='f2'? n(r.g2) : n(r.g3);
    return g + add;
  }
  var base = floor==='f1'? n(r.r1) : floor==='f2'? n(r.r2) : n(r.r3);
  return (base + add) * (wt.size==='XL' ? n(r.xl) : 1);
}
function winTypePanes(wt){ return (wt.f1||0)+(wt.f2||0)+(wt.f3||0); }
function winTypeSubtotal(wt, r){
  return ['f1','f2','f3'].reduce(function(s,f){ return s + winPanePrice(wt,f,r)*(wt[f]||0); },0)
       + (wt.screens||0)*n(r.screen);
}
function winParts(svc){
  var r = svc.rates, d = svc.data;
  var ext = d.types.reduce(function(s,wt){
    return s + ['f1','f2','f3'].reduce(function(a,f){ return a + winPanePrice(wt,f,r)*(wt[f]||0); },0);
  },0);
  var screens = d.types.reduce(function(s,wt){ return s + (wt.screens||0)*n(r.screen); },0);
  var interior = ext * (n(r.interiorPct)/100);
  var mirrors = (d.mirrors||0)*n(r.mirror);
  var sky = (d.skylights||0)*n(r.skylight);
  var panes = d.types.reduce(function(s,wt){ return s + winTypePanes(wt); },0);
  return { ext:ext, screens:screens, interior:interior, mirrors:mirrors, sky:sky, panes:panes,
           total: ext+screens+interior+mirrors+sky };
}
function withMin(raw, min, hasQty){ if(!hasQty) return 0; return Math.max(raw, n(min)); }

function svcTotal(s){
  var d = s.data, r = s.rates;
  switch(s.type){
    case 'window': return winParts(s).total;
    case 'soft':   return withMin(n(d.sqft)*n(r.perSqft), r.min, n(d.sqft)>0);
    case 'roof':   return withMin(n(d.sqft)*n(r.perSqft), r.min, n(d.sqft)>0);
    case 'power':  {
      var raw = d.lines.reduce(function(a,l){ return a + n(l.sqft)*n(r[l.surface]); },0);
      var any = d.lines.some(function(l){ return n(l.sqft)>0; });
      return withMin(raw, r.min, any);
    }
    case 'gutter': {
      var raw2 = n(d.ft1)*n(r.r1) + n(d.ft2)*n(r.r2) + n(d.ft3)*n(r.r3);
      return withMin(raw2, r.min, (n(d.ft1)+n(d.ft2)+n(d.ft3))>0);
    }
    case 'deck': {
      var base = n(d.sqft)*n(r.perSqft);
      var mult = 1 + (d.railings? n(r.railPct)/100 : 0) + (d.stairs? n(r.stairPct)/100 : 0);
      return withMin(base*mult, r.min, n(d.sqft)>0);
    }
    case 'dryer':  return (n(d.standard)+n(d.ladder))*n(r.perVent) + n(d.ladder)*n(r.ladderAdd);
    case 'duct': {
      var raw3 = n(d.registers)*n(r.perRegister) + n(d.furnaces)*n(r.perSystem);
      return withMin(raw3, r.min, n(d.registers)>0);
    }
  }
  return 0;
}

/* ============ breakdown rows per service ============ */
function bdRow(k,sub,v){ return '<div class="bd-row"><span class="k">'+k+(sub?'<small>'+sub+'</small>':'')+'</span><span class="v">'+fmt(v)+'</span></div>'; }

function breakdownHTML(s){
  var d=s.data, r=s.rates, rows='';
  switch(s.type){
    case 'window': {
      var p = winParts(s);
      rows += bdRow('Exterior windows', p.panes+' pane'+(p.panes===1?'':'s'), p.ext);
      rows += bdRow('Interior', n(r.interiorPct)+'% of exterior', p.interior);
      if(p.screens>0) rows += bdRow('Screens','',p.screens);
      if(p.mirrors>0) rows += bdRow('Mirrors', d.mirrors+' \u00d7 '+fmt(n(r.mirror)), p.mirrors);
      if(p.sky>0) rows += bdRow('Skylights', d.skylights+' \u00d7 '+fmt(n(r.skylight)), p.sky);
      break;
    }
    case 'soft': case 'roof': {
      var raw = n(d.sqft)*n(r.perSqft);
      rows += bdRow(s.type==='roof'?'Roof area':'House exterior', n(d.sqft).toLocaleString()+' sq ft \u00d7 '+fmt(n(r.perSqft)), raw);
      if(n(d.sqft)>0 && raw < n(r.min)) rows += bdRow('Minimum applied','',n(r.min)-raw);
      break;
    }
    case 'power': {
      var rawp = 0;
      d.lines.forEach(function(l){
        if(n(l.sqft)>0){ var v = n(l.sqft)*n(r[l.surface]); rawp+=v;
          rows += bdRow(l.surface, n(l.sqft).toLocaleString()+' sq ft \u00d7 '+fmt(n(r[l.surface])), v); }
      });
      if(rawp>0 && rawp < n(r.min)) rows += bdRow('Minimum applied','',n(r.min)-rawp);
      if(!rows) rows = bdRow('No surfaces entered','',0);
      break;
    }
    case 'gutter': {
      var rawg=0;
      [['ft1','1st story','r1'],['ft2','2nd story','r2'],['ft3','3rd story','r3']].forEach(function(x){
        if(n(d[x[0]])>0){ var v=n(d[x[0]])*n(r[x[2]]); rawg+=v;
          rows += bdRow(x[1], n(d[x[0]])+' lin ft \u00d7 '+fmt(n(r[x[2]])), v); }
      });
      if(rawg>0 && rawg<n(r.min)) rows += bdRow('Minimum applied','',n(r.min)-rawg);
      if(!rows) rows = bdRow('No footage entered','',0);
      break;
    }
    case 'deck': {
      var base = n(d.sqft)*n(r.perSqft);
      rows += bdRow('Deck surface', n(d.sqft).toLocaleString()+' sq ft \u00d7 '+fmt(n(r.perSqft)), base);
      if(d.railings) rows += bdRow('Railings','+'+n(r.railPct)+'%', base*n(r.railPct)/100);
      if(d.stairs) rows += bdRow('Stairs','+'+n(r.stairPct)+'%', base*n(r.stairPct)/100);
      var tot = base*(1+(d.railings?n(r.railPct)/100:0)+(d.stairs?n(r.stairPct)/100:0));
      if(n(d.sqft)>0 && tot<n(r.min)) rows += bdRow('Minimum applied','',n(r.min)-tot);
      break;
    }
    case 'dryer': {
      var totalVents = n(d.standard)+n(d.ladder);
      rows += bdRow('Vents', totalVents+' \u00d7 '+fmt(n(r.perVent)), totalVents*n(r.perVent));
      if(n(d.ladder)>0) rows += bdRow('Ladder access', n(d.ladder)+' \u00d7 '+fmt(n(r.ladderAdd)), n(d.ladder)*n(r.ladderAdd));
      break;
    }
    case 'duct': {
      rows += bdRow('Registers', n(d.registers)+' \u00d7 '+fmt(n(r.perRegister)), n(d.registers)*n(r.perRegister));
      rows += bdRow('Furnace systems', n(d.furnaces)+' \u00d7 '+fmt(n(r.perSystem)), n(d.furnaces)*n(r.perSystem));
      var rawd = n(d.registers)*n(r.perRegister)+n(d.furnaces)*n(r.perSystem);
      if(rawd>0 && rawd<n(r.min)) rows += bdRow('Minimum applied','',n(r.min)-rawd);
      break;
    }
  }
  return rows;
}

function getCount(s, key){
  if(key.indexOf('wt:') === 0){
    var p = key.split(':');
    var wt = s.data.types.find(function(t){ return t.id === parseInt(p[1]); });
    return wt ? (wt[p[2]]||0) : 0;
  }
  return s.data[key]||0;
}
function setCount(s, key, val){
  val = Math.max(0, Math.min(9999, val|0));
  if(key.indexOf('wt:') === 0){
    var p = key.split(':');
    var wt = s.data.types.find(function(t){ return t.id === parseInt(p[1]); });
    if(wt) wt[p[2]] = val;
  } else {
    s.data[key] = val;
  }
}

  } else {
    svcList.innerHTML = services.map(function(s){

          I.chev+
        '</button>'+

          '<div class="svc-section">'+inputsHTML(s)+'</div>'+

            '<div data-bd>'+breakdownHTML(s)+'</div>'+

          '</div>'+
          '<div class="svc-section"><div class="svc-label">'+I.note+' Notes</div>'+
            '<textarea data-notes placeholder="Access notes, condition, customer requests">'+esc(s.notes)+'</textarea></div>'+
          '<button class="disclosure" data-act="rates" aria-expanded="'+(s.ratesOpen?'true':'false')+'">'+
            '<span class="dl">'+I.sliders+' Rates &amp; settings</span>'+I.chev+'</button>'+
          '<div class="rates'+(s.ratesOpen?' open':'')+'">'+
            '<p class="hint">Placeholder pricing. Update to your real rates.</p>'+ratesHTML(s)+'</div>'+
          '<div class="svc-section"><button class="btn btn-danger btn-full" data-act="removesvc">'+I.trash+' Remove '+meta.label+'</button></div>'+
        '</div>'+
      '</section>';
    }).join('');
  }
  updateTotals();
}

function updateTotals(){
  services.forEach(function(s){
    var el = svcList.querySelector('[data-svc="'+s.id+'"]');
    if(!el) return;
    var t = fmt(svcTotal(s));
    var a = el.querySelector('[data-sum]'); if(a) a.textContent = t;
    var b = el.querySelector('[data-sub]'); if(b) b.textContent = t;
    var c = el.querySelector('[data-bd]'); if(c) c.innerHTML = breakdownHTML(s);
  });
  var g = services.reduce(function(a,s){ return a + svcTotal(s); },0);
  document.getElementById('grandTotal').textContent = fmt(g);
  document.getElementById('svcCount').textContent = services.length
    ? services.length + ' service' + (services.length===1?'':'s')
    : 'No services added';
  if(typeof saveDraft === 'function') saveDraft();
}

/* Update the money on screen without rebuilding the DOM, so a field
   being typed into keeps its focus, caret, and partially entered value. */
function refreshFigures(s){
  var host = svcList.querySelector('[data-svc="'+s.id+'"]');
  if(host && s.type === 'window'){
    s.data.types.forEach(function(wt){
      var e = host.querySelector('[data-wtsub="'+wt.id+'"]');
      if(e) e.textContent = fmt(winTypeSubtotal(wt, s.rates));
    });
    var m = host.querySelector('[data-amt="mirrors"]');
    if(m) m.textContent = fmt((s.data.mirrors||0) * n(s.rates.mirror));
    var k = host.querySelector('[data-amt="skylights"]');
    if(k) k.textContent = fmt((s.data.skylights||0) * n(s.rates.skylight));
  }
  updateTotals();
}

function findSvc(el){
  var host = el.closest('[data-svc]');
  return host ? services.find(function(s){ return s.id === parseInt(host.dataset.svc); }) : null;
}

/* ============ events ============ */
svcList.addEventListener('click', function(e){
  var btn = e.target.closest('button');
  if(!btn) return;
  var s = findSvc(btn);
  if(!s) return;

  var act = btn.dataset.act;
  if(act === 'toggle'){ s.open = !s.open; render(); return; }
  if(act === 'rates'){ s.ratesOpen = !s.ratesOpen; render(); return; }
  if(act === 'removesvc'){
    if(!confirm('Remove ' + CATALOG[s.type].label + ' from this estimate?')) return;
    services = services.filter(function(x){ return x.id !== s.id; });
    render(); return;
  }
  if(act === 'addwintype'){ openWinDialog(s.id); return; }
  if(act === 'addline'){
    s.data.lines.push({ id:s.data.nextLineId++, surface:'Driveway', sqft:'' });
    render(); return;
  }
  if(btn.dataset.linedel){
    s.data.lines = s.data.lines.filter(function(l){ return l.id !== parseInt(btn.dataset.linedel); });
    render(); return;
  }
  if(btn.dataset.wtdel){
    s.data.types = s.data.types.filter(function(t){ return t.id !== parseInt(btn.dataset.wtdel); });
    render(); return;
  }
  if(btn.dataset.count){
    var key = btn.dataset.count;
    setCount(s, key, getCount(s, key) + parseInt(btn.dataset.dir));
    render(); return;
  }
  // segmented toggles inside service body
  var segHost = btn.closest('[data-seg]');
  if(segHost){
    Array.prototype.forEach.call(segHost.children, function(x){ x.setAttribute('aria-pressed','false'); });
    btn.setAttribute('aria-pressed','true');
    s.data[segHost.dataset.seg] = parseInt(btn.dataset.val);
    render(); return;
  }
});

svcList.addEventListener('input', function(e){
  var el = e.target;
  var s = findSvc(el);
  if(!s) return;
  if(el.dataset.numinput){
    var digits = el.value.replace(/[^0-9]/g,'').slice(0,4);
    if(digits !== el.value){
      // strip anything non-numeric without disturbing the caret position
      var pos = el.selectionStart - (el.value.length - digits.length);
      el.value = digits;
      try { el.setSelectionRange(pos, pos); } catch(err){}
    }
    setCount(s, el.dataset.numinput, digits === '' ? 0 : parseInt(digits,10));
    var cell = el.closest('.counter');
    if(cell) cell.classList.toggle('has-count', digits !== '' && parseInt(digits,10) > 0);
    refreshFigures(s);
    return;
  }
  if(el.hasAttribute('data-notes')){ s.notes = el.value; saveDraft(); return; }
  if(el.dataset.rate){ s.rates[el.dataset.rate] = el.value; refreshFigures(s); return; }
  if(el.dataset.field){ s.data[el.dataset.field] = el.value; refreshFigures(s); return; }
  if(el.dataset.line){
    var l = s.data.lines.find(function(x){ return x.id === parseInt(el.dataset.line); });

});

/* ============ persistence ============ */
var STORE = { draft:'tgg.est.draft.v1', saved:'tgg.est.saved.v1', rates:'tgg.est.rates.v1' };

var storageOK = (function(){
  try { var k='__tgg_test'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }
  catch(e){ return false; }
})();

function lsGet(key, fallback){
  if(!storageOK) return fallback;
  try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function lsSet(key, val){
  if(!storageOK) return false;
  try { localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e){ return false; }
}

var CLIENT_FIELDS = ['clientName','clientAddress','clientDate','preparedBy'];
var currentSavedId = null;

function snapshot(){
  var c = {};
  CLIENT_FIELDS.forEach(function(id){ c[id] = document.getElementById(id).value; });
  return { v:1, client:c, services:services, nextSvcId:nextSvcId, currentSavedId:currentSavedId };
}

function applySnapshot(snap){
  if(!snap) return false;
  try{
    CLIENT_FIELDS.forEach(function(id){
      if(snap.client && typeof snap.client[id] === 'string') document.getElementById(id).value = snap.client[id];
    });
    services = Array.isArray(snap.services) ? snap.services : [];
    // backfill any rate keys added since this estimate was saved
    services.forEach(function(s){
      var def = DEFAULTS[s.type];
      if(!def) return;
      Object.keys(def.rates).forEach(function(k){
        if(s.rates[k] === undefined) s.rates[k] = def.rates[k];
      });
    });
    nextSvcId = snap.nextSvcId || (services.reduce(function(m,s){ return Math.max(m,s.id); },0) + 1);
    currentSavedId = snap.currentSavedId || null;
    return true;
  } catch(e){ return false; }
}

var saveTimer = null;
function saveDraft(){
  if(!storageOK){ setStatus('Not saved. This browser is blocking local storage.', true); return; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    var okSave = lsSet(STORE.draft, snapshot());
    setStatus(okSave ? 'Saved to this device \u00b7 ' + timeNow() : 'Could not save. Storage may be full.', !okSave);
  }, 350);
}
function timeNow(){
  var d = new Date(), h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0');
  var ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  return h + ':' + m + ' ' + ap;
}
function setStatus(msg, warn){
  var el = document.getElementById('statusLine');
  el.className = 'status-line' + (warn ? ' warn' : '');
  el.innerHTML = (warn
      ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>'
      : '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'
    ) + '<span>' + msg + '</span>';
}

/* persist master rates separately so they survive across estimates */
function loadStoredRates(){
  var stored = lsGet(STORE.rates, null);
  if(!stored) return;
  Object.keys(DEFAULTS).forEach(function(k){
    if(!stored[k]) return;
    Object.keys(DEFAULTS[k].rates).forEach(function(rk){
      if(stored[k][rk] !== undefined) DEFAULTS[k].rates[rk] = stored[k][rk];
    });
  });
}
function storeRates(){
  var out = {};
  Object.keys(DEFAULTS).forEach(function(k){ out[k] = clone(DEFAULTS[k].rates); });
  lsSet(STORE.rates, out);
}

/* saved estimates library */
function getSaved(){ var a = lsGet(STORE.saved, []); return Array.isArray(a) ? a : []; }
function putSaved(a){ return lsSet(STORE.saved, a); }

function estimateLabel(){
  var nm = document.getElementById('clientName').value.trim();
  return nm || 'Untitled estimate';
}
function saveEstimate(){
  if(!storageOK){ alert('This browser is blocking local storage, so estimates cannot be saved here.\n\nOpen the tool at its own web address rather than inside another page.'); return; }
  var list = getSaved();
  var snap = snapshot();
  var total = services.reduce(function(a,s){ return a + svcTotal(s); },0);
  var rec = {
    id: currentSavedId || ('e' + Date.now()),
    label: estimateLabel(),
    address: document.getElementById('clientAddress').value.trim(),
    date: document.getElementById('clientDate').value,
    total: total,
    savedAt: Date.now(),
    payload: snap
  };
  var idx = list.findIndex(function(x){ return x.id === rec.id; });
  if(idx >= 0) list[idx] = rec; else list.unshift(rec);
  currentSavedId = rec.id;
  rec.payload.currentSavedId = rec.id;
  if(putSaved(list)){
    saveDraft();
    renderSavedList();
    setStatus('Estimate saved \u00b7 ' + timeNow());
  } else {
    alert('Could not save. Device storage may be full.');
  }
}

function renderSavedList(){
  var list = getSaved().sort(function(a,b){ return b.savedAt - a.savedAt; });
  var body = document.getElementById('savedBody');
  if(!storageOK){
    body.innerHTML = '<div class="master-note" style="background:var(--bg-danger);border-color:var(--border-danger,#eb5757);color:var(--text-danger)">'+
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="flex-shrink:0;margin-top:1px"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>'+
      '<span>This browser is blocking local storage, so saving is unavailable here. It works when the tool is opened at its own web address.</span></div>';
    return;
  }
  if(!list.length){
    body.innerHTML = '<div class="saved-empty">No saved estimates yet.<br>Tap <strong>Save this estimate</strong> below to keep the current one.</div>';
    return;
  }
  body.innerHTML = list.map(function(r){
    var d = new Date(r.savedAt);
    var when = (d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear();
    var svcN = (r.payload && r.payload.services ? r.payload.services.length : 0);
    return '<div class="saved-item'+(r.id===currentSavedId?' current':'')+'">'+
      '<button class="saved-load" data-load="'+r.id+'">'+esc(r.label)+
        '<small>'+(r.address?esc(r.address)+' \u00b7 ':'')+svcN+' service'+(svcN===1?'':'s')+' \u00b7 saved '+when+'</small></button>'+
      '<span class="saved-amt">'+fmt(r.total||0)+'</span>'+
      '<button class="mini-remove" data-del="'+r.id+'" aria-label="Delete estimate">'+I.trash+'</button>'+
    '</div>';
  }).join('');
}

function printStyles(){
  var out = '';
  var sheets = document.styleSheets;
  for(var i=0;i<sheets.length;i++){
    var rules;
    try { rules = sheets[i].cssRules; } catch(e){ continue; }
    if(!rules) continue;
    for(var j=0;j<rules.length;j++){
      var t = rules[j].cssText;
      // pull the print block's inner rules up to top level for the standalone doc
      if(rules[j].type === 4 && /print/.test(rules[j].conditionText || rules[j].media.mediaText)){
        var inner = rules[j].cssRules;
        for(var k=0;k<inner.length;k++) out += inner[k].cssText + '\n';
      }
    }
  }
  return out;
}

function exportPDF(){
  buildPrintView();
  var body = document.getElementById('printView').innerHTML;

  // Top-level page: the @media print stylesheet handles it directly.
  if(window.self === window.top){
    try { window.print(); return; } catch(e){ /* fall through */ }
  }

  // Embedded in a frame: open a standalone document instead.
  var win;
  try { win = window.open('', '_blank'); } catch(e){ win = null; }
  if(!win){
    alert('Your browser blocked the print window.\n\nOpen this file directly in a browser tab, then tap Export PDF again and choose "Save as PDF" as the destination.');
    return;
  }
  win.document.write(
    '<!DOCTYPE html><html><head><meta charset="utf-8"><title>TGG Estimate</title>'+
    '<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">'+
    '<style>@page{size:letter;margin:0.6in;}'+
    'body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;'+
    'font-size:11pt;color:#1e1e1e;margin:0;padding:24px;}'+
    printStyles()+
    '</style></head><body><div id="printView" style="display:block">'+body+'</div></body></html>'
  );
  win.document.close();
  win.focus();
  setTimeout(function(){ try{ win.print(); }catch(e){} }, 400);
}

document.getElementById('exportBtn').addEventListener('click', exportPDF);

/* ============ boot ============ */
(function boot(){
  loadStoredRates();
  setToday();

  var draft = lsGet(STORE.draft, null);
  var restored = false;
  if(draft && draft.services && (draft.services.length || (draft.client && draft.client.clientName))){
    restored = applySnapshot(draft);
  }

  render();

  if(!storageOK){
    setStatus('Not saving. This browser is blocking local storage.', true);
  } else if(restored){
    setStatus('Picked up where you left off');
  } else {
    setStatus('Saves to this device automatically');
  }
})();
